}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: transparent;
    border-radius: 8px;
    padding: 8px 0;
    min-width: 160px;
}

.dropdown-menu a {
    display: block;
    padding: 10px 16px;
    margin: 0;
}

.dropdown:hover .dropdown-menu {
    display: block;  
}

.dropdown-menu a:hover {
    background-color: #1a5276;
    color: #f0f0f0;
}
 


body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("bgg.jpg");
    background-size: cover;
    background-position: center;
    filter: blur(10px);
    transform: scale(1.1);
    z-index: -1;
}
